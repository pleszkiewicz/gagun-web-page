# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Generate route entry points and deploy in a single job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate static entry points for app routes
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const vm = require("node:vm");
          const index = fs.readFileSync("index.html", "utf8");
          const context = vm.createContext({ window: { gagunPageModules: [] } });

          for (const [, source] of index.matchAll(/<script\b[^>]*\bsrc="(pages\/[^"\s]+\.js)"/g)) {
            vm.runInContext(fs.readFileSync(source, "utf8"), context, { filename: source });
          }

          const pages = context.window.gagunPageModules;
          if (pages.length === 0) {
            throw new Error("No app routes found; refusing to deploy without route entry points.");
          }

          for (const page of pages) {
            if (!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(page.id)) {
              throw new Error(`Invalid app route: ${page.id}`);
            }

            fs.mkdirSync(page.id);
            fs.copyFileSync("index.html", `${page.id}/index.html`);
            console.log(`Generated /${page.id}/index.html`);
          }
          NODE
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
